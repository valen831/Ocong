<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Endless Run - Ocong</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }

        /* Tombol fullscreen di pojok kanan atas */
        #btn-fullscreen {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 9999;
            background: rgba(0,0,0,0.55);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 8px;
            color: #fff;
            font-size: 20px;
            width: 38px;
            height: 38px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            user-select: none;
        }
        #btn-fullscreen:hover {
            background: rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>

<!-- Tombol Fullscreen -->
<button id="btn-fullscreen" title="Toggle Fullscreen">⛶</button>

<script>
    var globalAmbience;
    var X_POSITION = { LEFT: 0, CENTER: 0, RIGHT: 0 };
    var Y_POSITION = { TOP: 0, CENTER: 0, BOTTOM: 0 };
</script>

<script src="sceneMenu.js"></script>
<script src="scenePlay.js"></script>

<script>
    var config = {
        type: Phaser.AUTO,
        width:  1366,
        height: 768,
        backgroundColor: '#000000',
        scene: [SceneMenu, ScenePlay],

        // ── SCALE MANAGER: fit ke layar, jaga aspek rasio ────
        scale: {
            mode:             Phaser.Scale.FIT,       // pas di layar tanpa distorsi
            autoCenter:       Phaser.Scale.CENTER_BOTH,
            width:            1366,
            height:           768,
            // Aktifkan fullscreen saat layar berubah
            expandParent:     true,
            fullscreenTarget: document.body
        }
    };

    var game = new Phaser.Game(config);

    // ── TOMBOL FULLSCREEN ─────────────────────────────────────
    var btnFS = document.getElementById('btn-fullscreen');
    btnFS.addEventListener('click', function () {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(function(err) {
                console.warn('Fullscreen gagal:', err);
            });
        } else {
            document.exitFullscreen();
        }
    });

    // Ganti ikon sesuai state fullscreen
    document.addEventListener('fullscreenchange', function () {
        btnFS.textContent = document.fullscreenElement ? '✕' : '⛶';
    });

    // Shortcut keyboard: F atau F11
    document.addEventListener('keydown', function (e) {
        if (e.key === 'f' || e.key === 'F') {
            btnFS.click();
        }
    });
</script>

</body>
</html>
